<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZUI MARK 1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background particles -->
    <div class="particles"></div>

    <!-- Top Navigation -->
    <header class="top-bar">

        <div class="logo">
            <span class="logo-dots">•••</span>
            <span>ZUI</span>
        </div>

        <div class="mark">
            MARK 1
        </div>

        <div class="status">
            <span class="status-dot"></span>
            ONLINE
        </div>

    </header>


    <!-- Main Interface -->
    <main class="main-container">

        <!-- ZUI Core -->
        <section class="core-section">

            <div class="zui-core">

                <div class="core-ring ring-1"></div>
                <div class="core-ring ring-2"></div>
                <div class="core-ring ring-3"></div>

                <div class="core-dots">
                    • • •
                    <br>
                    • ZUI •
                    <br>
                    • • •
                </div>

            </div>

            <h1>ZUI</h1>

            <p class="system-status">
                SYSTEM ONLINE
            </p>

            <p class="greeting">
                How can I assist you?
            </p>

        </section>


        <!-- Chat Area -->
        <section class="chat-container">

            <div class="chat-header">
                <span>CONVERSATION</span>
                <span class="connection">● SECURE</span>
            </div>

            <div class="chat-box">

                <div class="message zui-message">
                    <span class="sender">ZUI</span>
                    <p>Hello. ZUI MARK 1 is online.</p>
                </div>

            </div>

        </section>


        <!-- Input Area -->
        <section class="input-section">

            <button class="voice-button" title="Voice input">
                🎙
            </button>

            <input
                type="text"
                placeholder="Talk to ZUI..."
                autocomplete="off"
            >

            <button class="send-button">
                SEND
            </button>

        </section>


        <!-- System Controls -->
        <section class="controls">

            <button>
                🧠
                <span>MEMORY</span>
            </button>

            <button>
                🛠
                <span>TOOLS</span>
            </button>

            <button>
                ⚙
                <span>SETTINGS</span>
            </button>

        </section>

        <section
            class="theme-settings"
            id="theme-settings"
            aria-label="Theme settings"
            hidden
        >
            <div class="theme-settings-copy">
                <span class="theme-settings-title">APPEARANCE</span>
                <p>Choose your interface mode.</p>
            </div>
            <div class="theme-options" role="group" aria-label="Color theme">
                <button class="theme-option" type="button" data-theme="dark">
                    <span class="theme-swatch dark-swatch" aria-hidden="true"></span>
                    <span>DARK</span>
                </button>
                <button class="theme-option" type="button" data-theme="light">
                    <span class="theme-swatch light-swatch" aria-hidden="true"></span>
                    <span>LIGHT</span>
                </button>
            </div>
        </section>


        <!-- System Information -->
        <section class="system-panel">

            <div>
                <span>CORE</span>
                <strong>READY</strong>
            </div>

            <div>
                <span>NETWORK</span>
                <strong>CONNECTED</strong>
            </div>

            <div>
                <span>MARK</span>
                <strong>1.0</strong>
            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js?v=4"></script>

</body>
</html>
